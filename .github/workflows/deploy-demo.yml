name: Deploy demo + storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build demo
        run: pnpm --filter demo build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Build storybook
        run: pnpm --filter storybook-app build-storybook
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/storybook/

      - name: Combine artifacts
        run: |
          mkdir -p packages/demo/dist/storybook
          cp -r packages/storybook/storybook-static/. packages/demo/dist/storybook/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
